name: Update draft release

on:
  workflow_call:
    inputs:
      base-ref:
        description: 'Expected latest stable tag for an automatic release'
        required: false
        type: string
      bump:
        description: 'Version bump type'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine versions
        id: version
        env:
          BASE_REF: ${{ inputs.base-ref }}
          BUMP: ${{ inputs.bump }}
        run: |
          .github/scripts/release-version.sh "$BUMP" "$BASE_REF"

      - name: Generate release notes
        id: notes
        uses: github/copilot-release-notes@v1
        with:
          base-ref: ${{ steps.version.outputs.previous }}
          head-ref: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.release-notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          .github/scripts/update-draft-release.sh \
            "${{ steps.version.outputs.next }}" \
            "$RUNNER_TEMP/release-notes.md"
